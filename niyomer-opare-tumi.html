document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('pw').value;const msg=document.getElementById('msg');msg.textContent='যাচাই করা হচ্ছে…';try{const km=await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);try{sessionStorage.setItem('akhi-ff',p)}catch(_){}const html=new TextDecoder().decode(plain);document.open();document.write(html);document.close();}catch(err){try{sessionStorage.removeItem('akhi-ff')}catch(_){}msg.textContent='কোডটি সঠিক নয়। আবার চেষ্টা করুন অথবা লেখিকার সঙ্গে যোগাযোগ করুন।';}});
