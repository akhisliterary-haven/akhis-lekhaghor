<style>
:root{--bg:#fbf5ea;--ink:#2b2118;--mut:#85725e;--card:#fffdf8;--line:#e9dcc6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110e;--ink:#f3eadb;--mut:#a8987f;--card:#201a15;--line:#352c23}}
:root[data-theme="dark"]{--bg:#15110e;--ink:#f3eadb;--mut:#a8987f;--card:#201a15;--line:#352c23}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.95 "Noto Serif Bengali","Hind Siliguri",serif}
.wrap{max-width:660px;margin:0 auto;padding:16px 16px 56px}
.ui,button,.tab,.toc a{font-family:"Hind Siliguri","Noto Serif Bengali",sans-serif}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 6px;font-size:15px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--c1),var(--c2))}
.t0{--c1:#0d4a45;--c2:#f59e0b}.t1{--c1:#3b1d7a;--c2:#f43f5e}
.book[hidden]{display:none}
.cover{background:linear-gradient(150deg,var(--c1) 0%,var(--c1) 45%,var(--c2) 140%);color:#fff;border-radius:22px;padding:44px 22px 38px;text-align:center;position:relative;overflow:hidden}
.cover:before{content:"";position:absolute;inset:10px;border:1.5px solid rgba(255,255,255,.35);border-radius:15px}
.cover h1{font:700 44px/1.25 "Hind Siliguri",sans-serif;margin:0 0 6px}
.cover .sub{font:500 16px/1.6 "Hind Siliguri",sans-serif;opacity:.9;margin:0 0 30px}
.cover .by{font:500 14px "Hind Siliguri",sans-serif;opacity:.8;margin:0}
.cover .au{font:700 24px "Hind Siliguri",sans-serif;margin:0}
.toc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 10px;margin:18px 0 8px}
.toc h2{font:700 22px "Hind Siliguri",sans-serif;margin:0 0 10px}
.toc a{display:block;padding:10px 12px;margin:0 0 8px;border-left:5px solid var(--c2);background:var(--bg);border-radius:0 10px 10px 0;color:var(--ink);text-decoration:none;font-size:16px;line-height:1.5}
.toc a:hover,.toc a:focus-visible{background:var(--line);outline:none}
.ch{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-top:18px}
.ch h2{font:700 24px/1.4 "Hind Siliguri",sans-serif;margin:0 0 6px}
.ch .bar{height:4px;width:72px;border-radius:4px;background:linear-gradient(90deg,var(--c1),var(--c2));margin-bottom:14px}
.ch p{margin:0 0 14px}
.pend{color:var(--mut);font-style:italic}
.act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.cp{border:0;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:999px;padding:9px 18px;font-size:15px;font-weight:700;cursor:pointer}
.cp:disabled{opacity:.4;cursor:default}
.act a{color:var(--mut);font:500 14px "Hind Siliguri",sans-serif;text-decoration:none;margin-left:auto}
.tabs{display:none}</style>

<script>
const B=[
{n:"নিশুতিপুর",s:"গ্রামবাংলার এক ভৌতিক উপন্যাস",ch:[
["প্রথম অধ্যায়: শেষ ট্রেনের যাত্রী","শেষ ট্রেনটা যখন কালিদহ হল্ট স্টেশনে থামল, ঘড়িতে তখন রাত সাড়ে নটা। অথচ অনির্বাণের মনে হলো, মাঝরাত বুঝি কবেই পেরিয়ে গেছে।\nকামরা থেকে নামল সে একাই। প্ল্যাটফর্মে একটামাত্র টিমটিমে বাতি, তাকে ঘিরে পোকার ভিড়। ট্রেনটা হুইসেল দিয়ে অন্ধকারে মিলিয়ে যেতেই চারদিক এমন চুপ হয়ে গেল যে নিজের নিশ্বাসের শব্দও কানে বাজতে লাগল।\nস্টেশনঘরের দরজায় তালা। টিকিট কাউন্টারের জানালায় মাকড়সার জাল। দেয়ালে ঝোলানো স্টেশনের নামফলকের রং চটে গেছে, শুধু “কালিদহ” শব্দটা আবছা পড়া যায়।\n“দাদাবাবু কি ঘোষাল বাড়ির?”\nপেছন থেকে গলাটা শুনে অনির্বাণ চমকে ফিরল। বাতির আলোর সীমানার ঠিক বাইরে একটা ভ্যানরিকশা, আর তার সিটে বসে এক বৃদ্ধ মানুষ। গায়ে ময়লা গামছা, চোখদুটো কোটরে ঢোকা।\n“আমি অনির্বাণ চৌধুরী। হরিনারায়ণবাবু আমার দাদু ছিলেন।”\n“জানি,” বুড়ো বলল। “আপনার জন্যই বসে আছি। আমি নিতাই। আপনার দাদুর কাছে অনেক নুন খেয়েছি।”\nঅনির্বাণ একটু অবাক হলো। সে তো কাউকে খবর দেয়নি। তবু ক্লান্তির মধ্যে প্রশ্নটা চেপে গেল। ব্যাগটা ভ্যানে তুলে সে উঠে বসল।\nকাঁচা রাস্তা ধরে ভ্যান চলতে লাগল। দুপাশে ধানক্ষেত, তার ওপর ভেসে বেড়াচ্ছে পাতলা কুয়াশা। কোথাও একটা ব্যাঙও ডাকছে না। শহরের ছেলে অনির্বাণ জানে, গ্রামের রাত মানেই ঝিঁঝির একটানা ডাক। এখানে ঝিঁঝিও নেই।\n“গ্রামটা এত চুপ কেন, নিতাই কাকা?”\nনিতাই উত্তর দিল না। প্যাডেল ঘোরানোর ক্যাঁচক্যাঁচ শব্দটাই শুধু চলতে থাকল।\nখানিক পরে সামনে দেখা গেল বাঁশবনটা। রাস্তার দুধারে আকাশ-ছোঁয়া বাঁশের সারি মাথা নুইয়ে এসে মাথার ওপর যেন একটা সুড়ঙ্গ বানিয়ে ফেলেছে। ভেতরে অন্ধকার এতটাই গাঢ় যে ভ্যানের টর্চের আলোও বেশিদূর যেতে পারছে না।\nবাঁশবনের মুখে এসে নিতাই হঠাৎ ভ্যান থামিয়ে দিল।\n“এবার আপনি হেঁটে যান, দাদাবাবু। সোজা গেলেই বাড়ি, মিনিট দশেক।”\n“সে কী! আপনি তো নিয়ে যাবেন বললেন।”\n“এই বনের ওপারে আমি রাতে যাই না,” নিতাই চোখ নামিয়ে বলল। তার গলা এখন কাঁপছে। “আর একটা কথা মনে রাখবেন। রাতে বাড়িতে কেউ নাম ধরে ডাকলে সাড়া দেবেন না। যত চেনা গলাই হোক।”\nঅনির্বাণ হেসে ফেলল। “কাকা, দাদু আর নেই। বাড়িতে তো কেউ থাকার কথা নয়, ডাকবে কে?”\nনিতাই এবার তার দিকে তাকাল। সেই চাউনিতে এমন কিছু ছিল যে হাসিটা অনির্বাণের গলায় আটকে গেল।\n“সেই জন্যই তো বলছি,” বুড়ো ফিসফিস করে বলল।\nতারপর ভ্যান ঘুরিয়ে সে যেদিক থেকে এসেছিল সেদিকে ফিরে চলল, প্যাডেলে পা ফেলল প্রায় ছুটতে ছুটতেই।\n* * *\nবাঁশবনের ভেতর দিয়ে হাঁটার দশ মিনিট অনির্বাণের কাছে মনে হলো এক ঘণ্টা। বাঁশগাছগুলো বাতাসে একটু একটু দুলছিল, আর তাদের গা ঘষাঘষির শব্দটা ঠিক যেন কারও চাপা কথাবার্তার মতো। দু-একবার তার মনে হলো, পেছনে পাতা মাড়ানোর শব্দ হচ্ছে। টর্চ ঘুরিয়ে দেখল, কেউ নেই। শুধু তার নিজের ছায়াটা রাস্তার ওপর লম্বা হয়ে পড়ে আছে।\nবনের শেষে এসে সে দেখতে পেল বাড়িটা।\nঘোষাল বাড়ি। না, চৌধুরী বাড়িই বলা ঠিক, তবে গ্রামের লোক এখনও পুরনো জমিদারের নামেই চেনে। দোতলা, থামওয়ালা, চুনবালি খসা। ছোটবেলায় গরমের ছুটিতে এসে এই বাড়িকে মনে হতো রাজপ্রাসাদ। আজ চাঁদের আলোয় সেটাকে মনে হলো একটা বিশাল জন্তু, যে চুপ করে শুয়ে আছে আর শিকারের অপেক্ষা করছে।\nসদর দরজার তালার চাবি তার পকেটে। উকিলবাবু দিয়েছিলেন। মরচে-ধরা তালাটা খুলতে বেশ বেগ পেতে হলো। শেষে ক্যাঁচ করে একটা আওয়াজ তুলে পাল্লা সরে গেল, আর ভেতর থেকে একটা ভ্যাপসা ঠান্ডা বাতাস এসে তার মুখে লাগল। বাতাসে পুরনো কাঠ, ধুলো আর কেমন একটা মিষ্টি গন্ধ, ঠিক যেন বাসি রজনীগন্ধার।\nদাদু বেঁচে থাকতে ফুল খুব ভালোবাসতেন।\nঅনির্বাণ টর্চের আলোয় দেয়ালে সুইচবোর্ড খুঁজে নিল। আলো জ্বলল না। ইলেকট্রিকের লাইন নিশ্চয়ই কাটা। সে ব্যাগ থেকে মোমবাতি আর দেশলাই বের করল। কাঁপা শিখার আলোয় বৈঠকখানার জিনিসপত্র একে একে ফুটে উঠল। সাদা চাদরে ঢাকা সোফা, দেয়ালে পূর্বপুরুষদের তেলরঙা ছবি, আর কোণে দাদুর প্রিয় সেই বিশাল দেয়ালঘড়ি।\nঘড়ির কাঁটা থেমে আছে। তিনটে দশ।\nদাদু মারা গিয়েছিলেন ভোর তিনটে দশে, উকিলবাবু ফোনে সেটাই বলেছিলেন। কিন্তু সে তো তিন সপ্তাহ আগের কথা। ঘড়ির পেন্ডুলামটা ঠিক তখনই একবার দুলে উঠল। টিক।\nআর থামল।\nঅনির্বাণ নিজেকে বোঝাল, ট্রেনের ঝাঁকুনি আর অনাহারে মাথাটা ঘুরছে। সে দোতলার পুরনো ঘরটায় উঠে এল, যে ঘরে ছোটবেলায় শুতো। খাটের ওপর ধুলো ঝেড়ে বিছানা পাতল, জামাকাপড় না ছেড়েই শুয়ে পড়ল। ক্লান্তি এত গভীর ছিল যে চোখ বুজতেই ঘুম নেমে এল।\n* * *\nঘুম ভাঙল একটা শব্দে।\nমোমবাতি অনেক আগেই নিভে গেছে। ঘর ঘুটঘুটে অন্ধকার, শুধু জানালা দিয়ে চাঁদের একফালি আলো মেঝেতে পড়েছে। অনির্বাণ কান পেতে রইল। কিছুই নেই। হয়তো স্বপ্ন।\nতারপর শব্দটা আবার এল।\nনিচ থেকে। বৈঠকখানার দিক থেকে। খুব নরম, খুব চেনা একটা গলা, যে গলা সে ছোটবেলায় হাজারবার শুনেছে, গরমের দুপুরে আমসত্ত্ব হাতে ডাক দেওয়ার সময়।\n“অনি... ও অনি...”\nঅনির্বাণের সারা শরীরে বরফের মতো ঠান্ডা কী যেন নেমে গেল।\nএই নামে তাকে একজনই ডাকতেন। আর সেই মানুষটাকে সে নিজের চোখে শ্মশানে পুড়তে দেখেছে।\nনিতাইয়ের কথাগুলো কানের ভেতর বেজে উঠল। সাড়া দেবেন না। সে দাঁতে দাঁত চেপে বালিশে মুখ গুঁজল। কিন্তু ডাকটা থামল না। সিঁড়ির নিচ থেকে একটু একটু করে ওপরে উঠে আসতে লাগল, আর সঙ্গে সঙ্গে শোনা যেতে লাগল কাঠের সিঁড়িতে ধীর, ভারী পা ফেলার শব্দ। সেই শব্দ, যা সে চিনত। দাদুর লাঠির ঠক, ঠক, ঠক।\n“অনি... দরজাটা খোল, দাদুভাই। বড্ড ঠান্ডা লাগছে।”\nপায়ের শব্দ এসে থামল তার দরজার ঠিক বাইরে।\nঅনির্বাণ নিঃশ্বাস বন্ধ করে চেয়ে রইল দরজার নিচের ফাঁকটার দিকে। সেখান দিয়ে চাঁদের আলোয় দেখা যাচ্ছে দুটো ছায়া। দুটো পায়ের ছায়া, নিশ্চল।\nআর তখনই, তার নিজের ঠোঁটের ভেতর থেকে, তার ইচ্ছের বিরুদ্ধে, প্রায় অভ্যাসবশত বেরিয়ে এল একটা শব্দ।\n“যাই, দাদু...”\nবলেই সে বুঝল কী সর্বনাশ করে ফেলেছে।\nদরজার ওপাশে লাঠির ঠক শব্দটা থেমে গেল। তারপর, অনেকক্ষণ পর, সেই চেনা গলা খুব আস্তে, খুব তৃপ্ত গলায় বলল:\n“এই তো। এবার আমি ভেতরে আসতে পারি।”\n(চলবে)"],
["দ্বিতীয় অধ্যায়: সাড়া","কতক্ষণ সে ওভাবে পড়ে ছিল, অনির্বাণের মনে নেই। হাত-পা অসাড়, বুকের ভেতর হৃৎপিণ্ডটা এমন ধড়াস ধড়াস করছিল যে মনে হচ্ছিল পাঁজর ভেঙে বেরিয়ে আসবে।\nদরজার ওপাশে কোনো শব্দ নেই। অথচ সে স্পষ্ট টের পাচ্ছিল, ওখানে কেউ দাঁড়িয়ে আছে। অপেক্ষা করছে, ঠিক যেভাবে শিকারি অপেক্ষা করে।\nনিতাইয়ের কথাটা এবার তার মাথায় পরিষ্কার হয়ে উঠল। ওই ডাক শুধু ডাক নয়, ওটা ভেতরে ঢোকার অনুমতি চাওয়া। আর অনুমতিটা সে এইমাত্র দিয়ে ফেলেছে।\nদরজার কাঠে হালকা একটা আঁচড়ের শব্দ হলো। একবার। দুবার। তারপর ভেতর থেকে আঁটা কাঠের খিলটা, কেউ যেন নিচ থেকে আঙুলে ঠেলছে এমন করে, নিজে থেকেই একটু একটু করে সরতে লাগল।\nপাল্লা খুলে গেল এক হাত পরিমাণ। কেউ নেই। শুধু একটা স্যাঁতসেঁতে ঠান্ডা বাতাস ঘরে ঢুকল, আর তার সঙ্গে ভিজে মাটি আর বাঁশপাতার গন্ধ, রজনীগন্ধার বাসি গন্ধকে ছাপিয়ে।\nঅনির্বাণ চোখ বুজে ফেলল।\nমেঝেতে পা পড়ার শব্দ হলো। ধীরে, ভারী, ভেজা পায়ের শব্দ। শব্দটা ঘর পেরিয়ে খাটের দিকে এল। তারপর বিছানার ধারটা একটু দেবে গেল, ঠিক যেন কেউ বসেছে। যেমন দাদু বসতেন, ছোটবেলায় গল্প শোনানোর আগে।\nকানের এত কাছে একটা ফিসফিস হলো যে ঠান্ডা নিশ্বাস গালে লাগল:\n“ভয় পাচ্ছিস কেন, অনি? আমি তো এসে গেছি।”\nঠিক তখনই, দূরে কোথাও, একটা মোরগ ডেকে উঠল।\nবিছানা থেকে ভারটা সরে গেল। ঠান্ডা বাতাসটাও। অনির্বাণ চোখ খুলল না, যতক্ষণ না জানালার ফাঁক দিয়ে ফ্যাকাশে ভোরের আলো মেঝেতে এসে পড়ল।\n* * *\nসকালে উঠোনে নামতেই সে দেখল নিতাই গেটের সামনে বটতলায় উবু হয়ে বসে আছে। চোখ লাল, গায়ের গামছা শিশিরে ভেজা।\n“সারারাত এখানেই ছিলাম,” নিতাই বলল। “ভেতরে ঢোকার সাহস পাইনি। আপনি ঠিক আছেন তো?”\n“তুমি আমাকে আগে কেন সব খুলে বললে না?”\n“বললে কি আপনি আসতেন?”\nজবাব নেই। অনির্বাণ চুপ করে রইল।\nনিতাই উঠে পড়ে বাড়ির সদর দরজার দিকে এগোল। দরজার চৌকাঠের ওপর, ধুলোয়, চোখে পড়ল পায়ের ছাপ। ভেজা মাটির ছাপ, খালি পায়ের, বাঁশপাতা লেগে আছে। ছাপগুলো ঘরের দরজা থেকে সিঁড়ি বেয়ে সোজা অনির্বাণের শোওয়ার ঘর অবধি গেছে।\nফেরার কোনো ছাপ নেই।\nআর বাঁ পায়ের ছাপে একটা আঙুল বাঁকা হয়ে আছে। অনির্বাণ এই ছাপ চিনত। দাদুর ছোটবেলায় লোহার গেটে পা চাপা পড়ে একটা আঙুল বেঁকে গিয়েছিল। সে বহুবার সেটা নিয়ে ঠাট্টা করেছে।\nনিতাইয়ের মুখ আরও ফ্যাকাশে হয়ে গেল।\n“আপনি সাড়া দিয়ে ফেলেছেন,” সে ফিসফিস করে বলল। তারপর কোমরের কাছে গামছার গিঁট খুলে একটা পুরনো খাম বের করল। “আপনার দাদু মরার তিন দিন আগে আমার হাতে এটা দিয়ে বলেছিলেন, অনি এলে দিস। তার আগে নয়। আমি ভেবেছিলাম, আপনি এসে ঢুকলেই দেব। কিন্তু...”\nঅনির্বাণ হাত বাড়িয়ে খামটা নিল। দাদুর কাঁপা কাঁপা হাতের লেখা:\n<em>“অনি, এ চিঠি যদি পড়ছিস, তাহলে তুই এসে গেছিস। রাতে যে তোকে ডাকবে, সে আমি নই। তার গলা আমার মতো, কিন্তু সে আমি নই। ডাকে কখনও সাড়া দিবি না। আর ঘড়িটা, ওই দেয়ালঘড়িটা, ভুলেও চালু করিস না। ওটা থেমে আছে বলেই ও এখনও ওই বাড়িতে বাঁধা।”</em>\nচিঠির পাতাটা তার হাতে থরথর করে কাঁপছিল।\nঠিক তখনই, ওপরের বৈঠকখানার জানালা থেকে, ভোরের নিস্তব্ধতা চিরে ভেসে এল একটা শব্দ। খুব ধীর, খুব নিয়মিত।\nটিক।\nঅনির্বাণ আর নিতাই একসঙ্গে মুখ তুলে তাকাল। জানালার ওপাশে ঘড়ির পেন্ডুলামটা দুলছিল।\n<em>(চলবে)</em>"],
["তৃতীয় অধ্যায়: ঘড়ির ঘর","সিঁড়ি বেয়ে ওপরে ওঠার সময় নিতাই একবারও অনির্বাণের পাশ ছাড়ল না। তার হাতে একটা মোটা বাঁশের লাঠি, যদিও দুজনেই জানত, ওই লাঠি দিয়ে কিছু হবে না।\nবৈঠকখানার দরজা হাট করে খোলা। ভেতরে সকালের আলো এসে পড়েছে, ধুলো ভাসছে সেই আলোয়। আর দেয়ালে দাদুর সেই বিশাল ঘড়ি, কালো কাঠের খোলে, কাচের পাল্লার ওপাশে পেন্ডুলামটা দুলছে। টিক। টিক। টিক।\nকিন্তু কাঁটা দুটো নড়ছে না। তিনটে দশ।\n“এ কেমন কথা,” অনির্বাণ ফিসফিস করে বলল। “কাঁটা থেমে, অথচ পেন্ডুলাম চলছে?”\n“ওটা আপনার দাদু মরার রাত থেকেই চলছে,” নিতাই বলল। “গাঁয়ের লোক রাতে বাইরে থেকে শুনতে পায়। কেউ ওদিকে তাকায় না।”\nঅনির্বাণ ধীর পায়ে ঘড়ির সামনে গিয়ে দাঁড়াল। কাচে তার নিজের মুখটা ফ্যাকাশে, চোখের নিচে কালি। সে হাত বাড়িয়ে পেন্ডুলামটা ধরতে গিয়েও থেমে গেল। চিঠিতে দাদু লিখেছিলেন ঘড়ি চালু করতে নিষেধ করেছেন, থামাতে নয়। কিন্তু কোনটা ঠিক, সে ঠিক জানে না।\nতার চোখ গেল লেখার টেবিলের দিকে।\nটেবিলের ওপর একটা মোটা, চামড়ায় বাঁধানো খাতা পড়ে আছে। মলাটে ধুলো নেই, যেন কেউ একটু আগেই ওটা ঘেঁটেছে। অনির্বাণ খাতাটা তুলে নিল। শেষ কয়েক পাতা দাদুর হাতের লেখায় ঠাসা, লেখাগুলো ক্রমশ এলোমেলো হয়ে এসেছে।\n<em>“ভাদ্র, কৃষ্ণা চতুর্দশী। আজ আবার ডাকল। আমার গলায়, ঠিক আমার গলায়। বুঝতে পারি, ও আমাকে শিখে নিচ্ছে।”</em>\n<em>“ঘড়ির কাঁটা আটকে দিয়েছি। ও সময়কে ভর করে ঘোরে। যতক্ষণ কাঁটা না নড়ে, ততক্ষণ ও এই বাড়ির সীমা পেরোতে পারে না। কিন্তু এভাবে আর কতদিন?”</em>\n<em>“বাবার মুখে শুনেছিলাম, বাঁশবনের নিচে কিছু পোঁতা আছে। তখন বিশ্বাস করিনি। এখন জানি, ও সেখান থেকেই এসেছে। যে পুঁতেছিল, সে আমাদেরই রক্ত। তাই রক্তের ডাক ছাড়া ও থামবে না।”</em>\nঅনির্বাণের গলা শুকিয়ে এল। সে পাতা উল্টাল।\nশেষ পাতাটা প্রায় কিছুই লেখা নেই। শুধু একটা লাইন, কালি ছড়িয়ে গেছে, যেন লেখার সময় হাত কাঁপছিল:\n<em>“অনি এলে ওকে বলিস, ডাকে সাড়া দিলেও ভয় নেই, যদি বাঁশবনে যাওয়ার আগে সূর্য ডোবার আগে পৌঁছে যায়।”</em>\n“কী লিখেছেন?” নিতাই ঘাড়ের ওপর দিয়ে উঁকি দিল।\nঅনির্বাণ উত্তর দিল না। সে বাক্যটা আরও একবার পড়ল। ভুল পড়েনি। কিন্তু বাক্যটা অদ্ভুত। এলোমেলো। যেন দাদু লিখতে লিখতেই অন্য কিছু ভাবছিলেন, কিংবা, আর কেউ তাঁর হাত দিয়ে...\nসে ভাবনাটা শেষ করতে পারল না।\nঘড়ির কাচে, তার নিজের মুখের ঠিক পেছনে, আরেকটা মুখ ফুটে উঠল।\nস্পষ্ট নয়। ঝাপসা। কিন্তু চেনা: সাদা ভুরু, ঢোকা গাল, পাতলা ঠোঁটের কোণে সেই চিরপরিচিত আধো-হাসি। ঠোঁট দুটো নড়ছিল। কোনো শব্দ নেই, তবু অনির্বাণ পড়ে নিল ঠোঁটের নড়ন:\n<em>“আজ রাতে। বাঁশবনে। একা।”</em>\nসে ঝট করে ঘুরে দাঁড়াল। কেউ নেই। শুধু নিতাই, লাঠি আঁকড়ে ধরে, ভয়ে সাদা।\n“কী দেখলেন?”\nঅনির্বাণ জানালার দিকে তাকাল। বাইরে ভোরের আলো এখন সকালের রোদে বদলে গেছে, বাঁশবনটা সোনালি পাতায় ঝলমল করছে। দিনের বেলায় ওটাকে কত নিরীহ লাগে।\n“নিতাই কাকা,” সে ধীরে বলল, “এই গাঁয়ে কেউ কি আছে, যে আমার বাবার ঠাকুরদার আমলের কথা জানে?”\nনিতাই খানিক চুপ করে থেকে বলল, “আছেন একজন। রামকালী ঠাকুরের বিধবা, পদ্মদিদি। বয়স নব্বই ছাড়িয়েছে। উনি আপনার বাড়ির কাউকে ক্ষমা করেননি এখনও।”\n“কেন?”\n“সে উনিই বলবেন,” নিতাই বলল। “যদি বলেন।”\nঘড়ির পেন্ডুলাম তখনও দুলছে। টিক। টিক। টিক। আর অনির্বাণের মনে হলো, প্রতিটা টিকের সঙ্গে সঙ্গে সূর্য একটু একটু করে পশ্চিমে হেলছে।\n<em>(চলবে)</em>"],
["চতুর্থ অধ্যায়: পদ্মদিদি","পদ্মদিদির কুঁড়েঘর গ্রামের একেবারে শেষ মাথায়, পুকুরের ধারে। উঠোনে তুলসীমঞ্চ, তার পাশে একটা ভাঙা মোড়ায় একজন শীর্ণ বৃদ্ধা বসে আছেন। শনের মতো সাদা চুল, চোখ দুটো ঘোলাটে, দেখে মনে হয় বহুদিন আগেই আলো হারিয়েছে।\nঅনির্বাণ উঠোনে পা রাখতেই বৃদ্ধা মুখ ঘুরিয়ে বললেন, “তুই এসেছিস। আমি জানতাম।”\n“আপনি আমাকে দেখতে পাচ্ছেন?”\n“দেখি না। কিন্তু গন্ধ পাই। ওই বাড়ির গন্ধ তোর গায়ে লেগে আছে, ভিজে মাটি আর বাঁশপাতা।” বৃদ্ধা একটু থামলেন। “কাল রাতে সাড়া দিয়েছিস, তাই না?”\nঅনির্বাণ মাথা নিচু করল, তারপর মনে পড়ল, বৃদ্ধা দেখতে পান না। “হ্যাঁ।”\n“তাহলে আর সময় নেই। বোস।”\nনিতাই দূরে দাঁড়িয়ে রইল, উঠোনে ঢুকল না। অনির্বাণ বৃদ্ধার সামনে মাটিতে বসল।\n“নবীন ঘোষাল ছিলেন তোর দাদুর মায়ের বাবা,” পদ্মদিদি শুরু করলেন। কণ্ঠস্বর ধীর, যেন বহুদিন ধরে এই কথাগুলো মনে মনে আওড়াচ্ছেন। “আমি তখন আট বছরের মেয়ে। ঘোষাল বাড়িতে বিলেত থেকে আনা এক দেয়ালঘড়ি বসানোর কথা হলো। বসাতে এল শহরের এক ঘড়ির মিস্ত্রির ছেলে, সাদেক। বয়স সতেরো-আঠারো। ছেলেটার হাতে যেন জাদু ছিল।”\n“তারপর?”\n“ঘড়ি বসল, চলল। তিন দিন পর নবীনবাবুর সোনার পকেটঘড়ি হারাল। কে নিয়েছে, কেউ জানে না। কিন্তু সন্দেহ গিয়ে পড়ল ওই ছেলেটার ওপর। তাকে বাড়ির ভেতর আটকে রাখা হলো। সে বলল, আমি নিইনি, আমি নিইনি। কেউ শুনল না।”\nবৃদ্ধার গলা কেঁপে উঠল।\n“সেই রাতে, ঠিক তিনটে দশে, নবীনবাবুর লোকেরা তাকে বাঁশবনে নিয়ে গেল। জ্যান্ত পুঁতে দিল। আমি জানালা দিয়ে দেখেছিলাম। ছেলেটা যতক্ষণ গলা ছিল, ততক্ষণ একটা কথাই বলছিল। মা, আমি এখানে। মা, আমি এখানে।”\nঅনির্বাণের গলা শুকিয়ে কাঠ। “আর ঘড়িটা?”\n“পরদিন ভোরে ঘড়ির কাঁটা থেমে গিয়েছিল। তিনটে দশে। সেই যে থামল, কোনো মিস্ত্রি আর চালাতে পারল না। আর পকেটঘড়িটা? সেটা পাওয়া গিয়েছিল নবীনবাবুর নিজেরই জামার ভেতরে, পরদিন। কেউ ভুল করে রেখে দিয়েছিল।”\nচারদিক নিস্তব্ধ। পুকুরের জলে একটা মাছ ঘাই মারল।\n“সাদেকের মা রাতের পর রাত বাঁশবনের ধারে বসে থাকতেন,” বৃদ্ধা বললেন। “শেষ দিন তিনি অভিশাপ দিয়ে গেলেন। এই বংশের রক্তে যে-ই ডাকবে, তার গলা নিয়েই ও ফিরে আসবে। ঠিক যেভাবে সে মায়ের গলা শুনতে চেয়েছিল।”\n“তাহলে দাদু?”\n“তোর দাদু জানত। সারা জীবন ঘড়ি আগলে রেখেছে, কাঁটা যেন না নড়ে। কিন্তু আজ তিন সপ্তাহ হলো সে নেই। আর এখন ওই ছেলেটা, কিংবা ওর রাগ, ওর শোক, যা-ই বল, তোর দাদুর গলায় ডাকছে। তোকে ডাকছে।”\nঅনির্বাণ তার পকেট থেকে চিঠিটা বের করে বলল, “দাদু লিখে গিয়েছিলেন, সাড়া না দিতে। আর খাতার শেষ পাতায় লেখা, সাড়া দিলেও ভয় নেই, যদি সূর্য ডোবার আগে বাঁশবনে পৌঁছে যাই।”\nপদ্মদিদির ঘোলাটে চোখ দুটো হঠাৎ প্রখর হয়ে উঠল। “কী বললি?”\nঅনির্বাণ লাইনটা আবার পড়ে শোনাল।\n“ওটা হরির লেখা নয়,” বৃদ্ধা ফিসফিস করে বললেন। “হরি সারা জীবন বলে গেছে, সূর্য ডোবার পর ওই বনে যাস না। সূর্য ডোবার আগে নয়, পরে। তোর দাদুর হাত ধার করে ও-ই লিখেছে। ও চায় তুই বনে যাস, কিন্তু সন্ধ্যার পর, যখন ওর জোর বাড়ে।”\n“তাহলে আমি কী করব?”\n“আজ কৃষ্ণা চতুর্দশী। কাল অমাবস্যা। কাল রাতে ও পুরো শক্তি পাবে।” বৃদ্ধা হাত বাড়িয়ে অনির্বাণের কব্জি চেপে ধরলেন। হাতটা বরফের মতো ঠান্ডা, অথচ কী আশ্চর্য জোর। “আজই, সূর্য ডোবার আগে, তুই বনে গিয়ে ওর হাড় খুঁজে বের করবি। তোর রক্তের হাতে ওকে ঘরে ফেরাতে হবে। শ্রাদ্ধ করতে হবে, ঠিকমতো, ওর ধর্ম মতো। আমি বলে দেব কীভাবে। কিন্তু তার আগে, এক ফোঁটাও দেরি করিস না।”\nঅনির্বাণ উঠে দাঁড়াল। মাথার ভেতর সবকিছু ঘুরছে। আকাশের দিকে তাকিয়ে দেখল, সূর্য তখন মাথার ওপরে।\nহঠাৎ নিতাই ছুটে এসে তার হাত চেপে ধরল। মুখ ছাইয়ের মতো সাদা, চোখ বড় বড়।\n“দাদাবাবু,” সে ফিসফিস করে বলল, “শুনুন।”\nবাঁশবনের দিক থেকে, বহুদূর থেকে, ভেসে আসছিল একটা গলা। স্পষ্ট, পরিষ্কার, ঠিক যেন কেউ হাঁক দিচ্ছে:\n“নিতাই কাকা... আমি এখানে। নিতাই কাকা, আমাকে বাঁচাও...”\nঅনির্বাণ স্তব্ধ হয়ে দাঁড়িয়ে রইল। কারণ গলাটা তারই।\n<em>(চলবে)</em>"],
["পঞ্চম অধ্যায়: মাটির নিচে","পদ্মদিদি যা যা বলে দিলেন, সবটাই অনির্বাণ মনে রাখল। ছেলেটা মুসলমান ছিল, তাই তাকে ফেরাতে হবে তার নিজের ধর্ম মতোই। গাঁয়ের বুড়ো মৌলবি রহমত আলিকে ডাকতে হবে, সাদা কাফনের কাপড় জোগাড় করতে হবে, আর কবরের জায়গা ঠিক করতে হবে পুকুরপাড়ের কবরস্থানে।\nনিতাই ছুটল। ঘণ্টাখানেকের মধ্যে সে ফিরে এল একটা কোদাল, একটা শাবল, ভাঁজ করা সাদা কাপড় আর সঙ্গে মৌলবি সাহেবকে নিয়ে। বৃদ্ধ মৌলবি শুধু একবার অনির্বাণের মুখের দিকে তাকিয়ে নিচু গলায় বললেন, “আল্লাহ তোমাকে সাহস দিন, বাবা। ওই ছেলেটা বহুদিন ধরে মাটির নিচে একা।”\nবাঁশবনের মুখ অবধি সবাই এল। তারপর নিতাই আর মৌলবি দুজনই থেমে গেলেন, যেন অদৃশ্য কোনো দেয়ালে ঠেকে গেছেন।\n“আমরা এখানেই থাকব,” মৌলবি বললেন। “তুমি যাও। আমি এখান থেকে দোয়া পড়ব।”\nঅনির্বাণ কোদাল কাঁধে বনে ঢুকল।\nদিনের বেলাতেও ভেতরে আলো প্রায় আসে না। ঘন বাঁশের সারি মাথার ওপর ছাউনি বানিয়েছে, পায়ের নিচে শুকনো পাতার স্তূপ, প্রতি পদক্ষেপে মচমচ করে উঠছে। বনের ঠিক মাঝখানে, একটা পুরনো বাঁশঝাড়, যার সবগুলো গাছ ছাতার মতো মাঝখানের দিকে হেলে আছে, যেন কিছু একটাকে আগলে রেখেছে।\nপদ্মদিদি বলেছিলেন, ওটাই জায়গা।\nসে কোদাল চালাতে শুরু করল।\nমাটি ভেজা, ভারী। খানিক খুঁড়তেই বনের ভেতর থেকে শব্দ উঠল। প্রথমে অনেক দূর থেকে, তারপর ধীরে ধীরে কাছে।\n“অনি... ও অনি...”\nদাদুর গলা। অনির্বাণ দাঁতে দাঁত চেপে কোদাল চালিয়ে গেল।\n“অনি, বাবা, ফিরে আয়। এ তুই কী করছিস?”\nএবার মায়ের গলা। মা বেঁচে আছেন, কলকাতার ফ্ল্যাটে, এখনও হয়তো ঘুমোচ্ছেন। তবু গলাটা এত নিখুঁত, এমন কান্নাভেজা, যে তার হাত থেমে যেতে চাইল। সে আরও জোরে কোদাল চালাল।\nতারপর নিতাইয়ের গলা, তারপর একটা অচেনা শিশুর, তারপর একসঙ্গে অনেকগুলো, সবাই তার নাম ধরে ডাকছে। অনির্বাণ কানে আঙুল দিল না, শুধু মাথা নিচু করে খুঁড়ে চলল।\nঘণ্টাখানেক পর কোদালের ডগায় শক্ত কিছু ঠেকল।\nসে হাঁটু গেড়ে বসে হাত দিয়ে মাটি সরাল। প্রথমে একটা পাঁজরের হাড়, তারপর আরও। শেষে বেরিয়ে এল একটা খুলি, মাটি-মাখা, কোটরগুলো অন্ধকার। কঙ্কালের দুই হাত ওপরের দিকে তোলা, আঙুলগুলো বেঁকে আছে, যেন মরার আগের মুহূর্তে সে মাটি আঁচড়ে ওপরে উঠতে চেয়েছিল।\nঅনির্বাণের চোখে জল এসে গেল। সে নিজেই বুঝতে পারল না কেন।\n“ক্ষমা করো,” সে বিড়বিড় করে বলল। “আমরা অন্যায় করেছিলাম। আমি তোমাকে ঘরে নিয়ে যাব।”\nপাঁজরের মাঝখানে কিছু একটা চকচক করছিল। সে সাবধানে হাত বাড়িয়ে তুলে আনল। একটা ছোট পিতলের ঘড়ি, মরচে ধরা, চেনটা ছিঁড়ে গেছে। কাচ ভাঙা, কাঁটা দুটো তিনটে দশে আটকে।\nআর তখনই, তার হাতের মুঠোয়, ঘড়িটা টিক করে একবার শব্দ করল।\nঅনির্বাণ চমকে হাত থেকে ছেড়ে দিতে গেল, কিন্তু পারল না। ঘড়ির সেকেন্ডের কাঁটাটা কাঁপতে কাঁপতে একটা ঘর এগোল। তারপর আরেকটা।\nতার চারপাশের সব কণ্ঠ একসঙ্গে থেমে গেল।\nবনে এখন এমন নিস্তব্ধতা, যেন কেউ পৃথিবীর সব শব্দ কেটে ফেলেছে। অনির্বাণ মুখ তুলে তাকাল। বাঁশপাতার ফাঁক দিয়ে যে আলোটুকু আসছিল, তা আর নেই। চারদিক ধূসর, তারপর ক্রমশ কালো।\nসে তাড়াতাড়ি পকেট থেকে ফোন বের করল। স্ক্রিনে সময় ঝলসে উঠল: ৬:০৭।\nসে বনে ঢুকেছিল দুপুরে। এক-দেড় ঘণ্টা কেটেছে, বড়জোর।\nদূর থেকে নিতাইয়ের গলা ভেসে এল, ক্ষীণ, ভাঙা, আতঙ্কে ভরা: “দাদাবাবু! সূর্য ডুবে গেছে! বেরিয়ে আসুন!”\nঅনির্বাণ কঙ্কালের দিকে তাকাল, তারপর সাদা কাপড়ের দিকে। কাফন জড়ানোর সময় আর নেই, কিন্তু একা হাড় ফেলেও যাওয়া যায় না।\nঠিক তখন তার পেছন থেকে, খুব কাছ থেকে, একটা কিশোর কণ্ঠ কাঁদো কাঁদো গলায় ডেকে উঠল। দাদুর গলা নয়, মায়ের নয়, তার নিজের নয়। একেবারে অচেনা, একেবারে সত্যি একটা গলা:\n“মা... আমি এখানে। মা, আমাকে নিয়ে যাও...”\n<em>(চলবে)</em>"],
["ষষ্ঠ অধ্যায়: দুটি গলা","অনির্বাণ ধীরে ঘুরে দাঁড়াল।\nঅন্ধকার বাঁশবনে, ঠিক তার সামনে, একটা ছেলে দাঁড়িয়ে আছে। বয়স সতেরো-আঠারো, রোগা, খালি গা, কোমরে একটা ময়লা লুঙ্গি। হাতে কিছু নেই, শুধু আঙুলগুলো বাঁকা, মাটিতে আঁচড় কাটার মতো। মুখটা স্পষ্ট দেখা যাচ্ছে না, কিন্তু চোখ দুটো ভেজা, ভীষণ ভেজা।\n“তুমি... সাদেক?”\nছেলেটা কোনো উত্তর দিল না। শুধু হাত বাড়াল অনির্বাণের মুঠোর দিকে, যেখানে ছোট পিতলের ঘড়িটা টিক টিক করছিল।\nঅনির্বাণ ঘড়িটা এগিয়ে দিল। “এটা তোমার। নাও।”\nছেলেটার আঙুল ঘড়ি ছুঁতেই বনের ভেতর একটা অদ্ভুত শব্দ উঠল, ঠিক যেন কেউ বহুদিনের চাপা নিশ্বাস ছেড়ে দিল। ছেলেটা ঘড়িটা বুকে চেপে ধরল, তারপর মুখ তুলে অনির্বাণের দিকে তাকাল। তার ঠোঁট কেঁপে উঠল।\n“মা কোথায়?”\nঅনির্বাণ জানত, এই প্রশ্নের একটাই সৎ উত্তর। সে গলা পরিষ্কার করে বলল, “তোমার মা অনেক বছর আগে চলে গেছেন। কিন্তু আমি তোমাকে তাঁর কাছে নিয়ে যাব, ঠিকমতো, তোমার নিজের নিয়মে। আমাকে একটু সময় দাও।”\nছেলেটা মাথা নামাল। এক ফোঁটা জল, কিংবা অন্য কিছু, তার গাল বেয়ে নামল। তারপর সে ধীরে ধীরে পিছিয়ে গেল, অন্ধকারে মিলিয়ে যাওয়ার আগে একবার, শুধু একবার, আঙুল তুলে অনির্বাণের পেছনে কিছু একটা দেখাল।\nঅনির্বাণের গা শিরশির করে উঠল।\nপেছনে তাকাতেই সে দেখল দাদু দাঁড়িয়ে আছেন।\nলম্বা, শীর্ণ, সাদা ধুতি, বাঁ পায়ের বাঁকা আঙুল, সব মিলে ঠিক দাদুরই মতো। কিন্তু দাদুর মুখে কখনও এমন হাসি দেখেনি সে। ঠোঁটের দুই কোণ কানের দিকে টানা, দাঁত বের করা, চোখ দুটো বড় বেশি চকচকে।\n“বাহ, অনি,” মূর্তিটা বলল, দাদুর গলায়। “কী সুন্দর কাজ করলি। এবার হাড়গুলো আমাকে দে।”\n“তুমি আমার দাদু নও।”\n“আমি তোর দাদুর চেয়েও বেশি কিছু। বহু বছর ধরে এই বংশের প্রতিটা মানুষের গলা আমার জানা। নবীনের, হরির, তোর মায়ের। তুই ভাবছিস ওই ছেলেটা আমাকে আটকে রেখেছিল? ভুল। ও ছিল আমার ছাউনি। ওর কান্না, ওর রাগ, ওর অপেক্ষা, সবটা আমার খাবার।”\nঅনির্বাণ ধীরে বুঝল। যা সে ভেবেছিল, ভুল। সাদেক কোনো ভূত নয়। সে একটা কাটা-ঘা, একটা বহুদিনের অমীমাংসিত বেদনা। আর এই জিনিসটা, যা-ই হোক, সেই ঘা-এর ওপর বসে বসে রক্ত চুষেছে।\n“তাহলে ওকে কবরে নিয়ে গেলে...”\n“তাহলে আমার ঠিকানা থাকবে না,” মূর্তিটা হিসহিস করে বলল। দাদুর মুখ তখন বিকৃত হয়ে উঠছে, চামড়া ফেটে ফেটে ভেতরের কালো বেরিয়ে আসছে। “দে। হাড়গুলো দে।”\nসে এক পা এগোল, আর অনির্বাণ মাটিতে নামানো কঙ্কালটার ওপর ঝাঁপিয়ে পড়ে সাদা কাপড়টা টেনে জড়াতে শুরু করল। বনের বাতাস পাগলের মতো ঘুরছে, বাঁশগাছগুলো একে অপরের গায়ে বাড়ি খেয়ে ক্যাঁচ ক্যাঁচ করছে, যেন অজস্র বুড়ো হাড় একসঙ্গে ভাঙছে। কেউ তার ঘাড়ে বরফ-ঠান্ডা নিশ্বাস ফেলছে, কেউ কানের কাছে চেঁচিয়ে উঠছে তার নিজের নামে।\nঠিক তখন, বনের বাইরে থেকে, একটা গভীর, ধীর, কাঁপা কাঁপা সুর ভেসে এল। মৌলবি রহমত আলির কণ্ঠ। আরবি কিছু পংক্তি, যার অর্থ অনির্বাণ জানে না, কিন্তু যার ভেতরে একটা অদ্ভুত স্থির জোর আছে।\nমূর্তিটা কানে হাত চাপা দিয়ে চিৎকার করে উঠল। বনের বাতাস মুহূর্তের জন্য থমকে গেল।\nঅনির্বাণ কঙ্কালের পুঁটলিটা বুকে চেপে ধরে ছুটল। সে জানে না কোন দিকে, শুধু সুরের দিকে। বাঁশের ডাল তার মুখে চাবুকের মতো লাগছে, পায়ের নিচে মাটি আঁকড়ে ধরতে চাইছে, পেছনে কেউ কিছু একটা গর্জন করছে, কিন্তু সে থামল না।\nআর তারপর, হঠাৎ, সামনে ফাঁকা। টর্চের আলো। নিতাইয়ের মুখ।\nসে মাটিতে লুটিয়ে পড়ল।\n* * *\nরাত তখন প্রায় দশটা। পুকুরপাড়ের কবরস্থানে কয়েকটা লণ্ঠনের আলোয় ছোট একটা কবর খোঁড়া হয়েছে। মৌলবি রহমত আলি জানাজা পড়লেন। অনির্বাণ, নিতাই, আর কোথা থেকে যেন এসে উপস্থিত হওয়া গাঁয়ের চার-পাঁচজন বুড়ো, সবাই চুপ করে দাঁড়িয়ে রইল।\nমাটি দেওয়া শেষ হলে কেউ কিছু বলল না। হাওয়াটা যেন হঠাৎ হালকা হয়ে গেছে।\nমৌলবি সাহেব অনির্বাণকে একপাশে ডেকে নিলেন। তাঁর মুখে স্বস্তির বদলে একটা অস্বস্তি।\n“ছেলেটা শান্তি পেয়েছে,” তিনি নিচু গলায় বললেন। “ওর গলা আমি বনে শুনেছি। ও কাঁদছিল। কিন্তু বাবা, তোমার দাদুর গলায় যে তোমাকে ডাকছিল, সে কাঁদত না। সে হাসত।”\n“মানে?”\n“মানে, সাদেকের শেষ ঘুমিয়ে পড়াটা শেষ ঘটনা ছিল না,” মৌলবি বললেন। “সে ছিল শুধু সূচনা।”\nঠিক তখনই, বহুদূর থেকে, ঘোষাল বাড়ির দিক থেকে, রাতের নিস্তব্ধতা ভেদ করে ভেসে এল একটা ঘণ্টাধ্বনি।\nঢং।\nঢং।\nঢং।\nনিতাইয়ের গলা থেকে একটা অস্ফুট শব্দ বেরোল। “ও ঘড়ি... ও তো দশ বছর ধরে ঘণ্টা বাজায় না।”\n<em>(চলবে)</em>"],
["সপ্তম অধ্যায়: নবীন ঘোষাল","ওরা প্রায় ছুটতে ছুটতে ঘোষাল বাড়িতে পৌঁছল। মৌলবি রহমত আলি বয়সের ভারে হাঁপাচ্ছেন, তবু থামলেন না। নিতাই লাঠিটা শক্ত করে ধরে আছে, যদিও এখন আর সেটা ভরসার জিনিস মনে হচ্ছে না।\nসদর দরজা হাট করে খোলা। ভেতরে কোথাও আলো নেই, শুধু ওপরের বৈঠকখানা থেকে একটা ফ্যাকাশে নীলচে আভা সিঁড়ি বেয়ে নেমে আসছে।\nআর শব্দ। টিক-টিক-টিক-টিক, এত দ্রুত, এত অস্বাভাবিক, যেন ঘড়ির ভেতরে একটা পাগল ছুটছে।\nঅনির্বাণ সিঁড়ি বেয়ে উঠল। পেছনে নিতাই আর মৌলবি।\nবৈঠকখানার দরজায় পৌঁছে সে থমকে দাঁড়াল। ঘড়ির কাঁটা এখন ঘুরছে। সেকেন্ডের কাঁটা নয়, ঘণ্টার কাঁটা, মিনিটের কাঁটা, দুটোই, উন্মাদের মতো। ঘরের ভেতরের বাতাস এমন ভারী যে নিশ্বাস নিতে কষ্ট হচ্ছে। আর ঘড়ির কাচের পাল্লাটা খোলা, ভেতর থেকে কালো ধোঁয়ার মতো কিছু একটা কুণ্ডলী পাকিয়ে বেরিয়ে আসছে।\nধোঁয়াটা ধীরে ধীরে আকার নিল।\nএবার আর দাদুর রূপ নয়। এক স্থূলকায় প্রৌঢ়, গায়ে জরির কাজ করা আচকান, কোমরে সোনার চেন ঝোলানো, গোঁফের ডগা পাকানো। চোখে এমন একটা নির্মম, ঠান্ডা দৃষ্টি, যা দেখলে বোঝা যায়, এ মানুষ কখনও কাউকে ক্ষমা করতে শেখেনি।\nনিতাইয়ের মুখ দিয়ে একটা শব্দ বেরোল। “নবীন কর্তা...”\n“চিনেছিস তাহলে,” ছায়াটা বলল। এবার তার নিজের গলায়, ভারী, গমগমে, জমিদারি হুকুমের সুরে। “আর এ ছোকরা? আমার রক্তের শেষ ফোঁটা। সাবাশ। সাড়া দিয়েছিস বলেই আজ আমি এ বাড়ির সীমা পেরিয়ে এতদূর আসতে পেরেছি।”\n“তুমি কে?” অনির্বাণ বলল, যদিও উত্তরটা সে আগেই জানে।\n“আমি এ বংশের যা কিছু পাপ, যা কিছু লোভ। সাদেকের মা অভিশাপ দিয়েছিল, আমার আত্মা এই ঘড়িতে বাঁধা পড়বে। দিয়েছিল। আমি মরেছি, কিন্তু যাইনি। বাঁধা পড়েছি ঘড়িতে, যতদিন কাঁটা থেমে থাকবে। তোর দাদু সেটাই বুঝেছিল। তাই কাঁটা আটকে রেখেছিল। কিন্তু এই বুড়ো এক ভুল করেছিল, সে মরে গেল।”\nছায়াটা এক পা এগোল। মেঝের কাঠ কাঁপল।\n“আর আমি এতদিন ছেলেটার কান্না গিলে বেঁচে ছিলাম। ওর অপেক্ষা আমার শক্তি। কিন্তু তুই ওকে কবর দিলি। বুদ্ধি আছে তোর।” ছায়াটার মুখে সেই কানের দিকে টানা হাসি ফুটে উঠল। “তবু তাতে কী? আমি এখন আর শুধু ঘড়িতে আটকে নেই। আজ রাতে, ঠিক তিনটে দশে, আমি তোর শরীরে ঢুকব। তুই নিজে আমাকে ডেকে এনেছিস। তুই সাড়া দিয়েছিলি।”\nঅনির্বাণের পা কাঁপল। “তার আগে আমি তোমাকে শেষ করব।”\n“কীভাবে?” ছায়াটা হো-হো করে হেসে উঠল। “তুই? একটা শহুরে ছোকরা?”\nতখনই মৌলবি রহমত আলি এগিয়ে এলেন। বৃদ্ধ হাতের তসবিটা তুলে ধরলেন, তাঁর গলা কাঁপছে, কিন্তু সোজা।\n“নবীন ঘোষাল,” তিনি বললেন। “ওই ছেলেটার মা একদিন আমারই এক চাচির বোন ছিলেন। এই গাঁয়ে সবাই জানে তুমি কী করেছিল। শুধু বলার সাহস ছিল না কারও। আজ আমরা বলব।”\n“কী বলবে?” ছায়াটা গর্জে উঠল।\n“সত্যিটা,” অনির্বাণ হঠাৎ বলে উঠল। তার মনে পড়ে গেছে পদ্মদিদির একটা কথা, যেটা তখন গুরুত্ব না দিয়েই শুনেছিল: <em>পকেটঘড়িটা পাওয়া গিয়েছিল নবীনবাবুর নিজেরই জামার ভেতরে।</em>\nসে ঘড়ির কাচের পাল্লার পাশে হাঁটু গেড়ে বসে, নিচের দেরাজের ভেতরে হাত ঢোকাল। সেখানে একটা ধুলোমাখা কাপড়ের পুঁটলি। ভেতরে সোনার একটা পকেটঘড়ি, আর তার সঙ্গে এক টুকরো পুরনো কাগজ।\nসে কাগজটা খুলে জোরে জোরে পড়তে শুরু করল। তার গলা ভাঙা, কিন্তু প্রতিটা শব্দ স্পষ্ট:\n<em>“আমি নবীনচন্দ্র ঘোষাল, স্বীকার করছি, সাদেক আমার ঘড়ি চুরি করেনি। আমি নিজে ঘড়ি লুকিয়েছিলাম, কারণ ওই ছোকরা আমার হিসাবের খাতা দেখে ফেলেছিল। আমি তাকে খুন করেছি।”</em>\nছায়াটা আর্তনাদ করে উঠল। সারা ঘর কাঁপছে। ঘড়ির কাঁটা এবার উল্টো দিকে ঘুরতে শুরু করেছে। কালো ধোঁয়া পাক খেয়ে খেয়ে ঘড়ির খোলের ভেতরে ফিরে যেতে চাইছে, যেন একটা অদৃশ্য শক্তি তাকে টেনে নিচ্ছে।\nকিন্তু ঘড়ির কাঁটা হঠাৎ থেমে গেল। ঠিক তিনটে দশে।\nআর ঘরের কোণ থেকে, ধুলোমাখা অন্ধকার থেকে, ভেসে এল একটা শীতল, ফিসফিসে স্বর। নবীনের নয়। অন্য কারও।\n“স্বীকারোক্তিতে আমার বাঁধন কাটল না, ছোকরা। কারণ আমি নবীন নই।”\n<em>(চলবে)</em>"],
["অষ্টম অধ্যায়: তিনটে দশ","ঘরের কোণের ধুলোমাখা অন্ধকারটা একটু একটু করে ঘন হয়ে একটা মানুষের আকার নিল।\nকঙ্কালসার চেহারা, সাদা ধুতি, কপালে চন্দনের ফোঁটা, ঝুলে পড়া কাঁধ। বাঁ পায়ের একটা আঙুল বাঁকা। চোখ দুটো গভীর, ক্লান্ত, অথচ ভীষণ স্নেহে ভরা।\n“অনি,” তিনি বললেন। কণ্ঠস্বর এত ক্ষীণ, যেন বহুদূর থেকে আসছে। “এবার আমি। আসল আমি।”\nঅনির্বাণ সিঁটিয়ে গেল। “তুমি... দাদু?”\nঘরের মাঝখানে নবীনের কালো ছায়াটা ঘড়ির খোলের ভেতর থেকে গর্জে উঠল। “মিথ্যে! ও নকল! ও আমারই আরেক রূপ!”\nঅনির্বাণ দ্বিধায় পড়ল। দুজনেই দাদুর রূপ ধরতে পারে, দুজনেই তার নাম জানে। কাকে বিশ্বাস করবে?\nতখন, ঘরের দরজায়, একটা মৃদু শব্দ হলো। ভেজা পায়ের শব্দ।\nসেখানে দাঁড়িয়ে সাদেক। এবার তার মুখ স্পষ্ট। শান্ত, ক্লান্ত, অনেকটা ছেলেমানুষ। বুকে চেপে ধরা সেই পিতলের ঘড়ি, যার কাঁটা এখন নিঃশব্দে এগোচ্ছে। সে একবার নবীনের ছায়ার দিকে তাকাল। তারপর ধীরে ধীরে, কোণের বৃদ্ধের দিকে ফিরে, মাথা নুইয়ে সালাম জানাল।\nনবীনের দিকে সে একবারও ফিরে তাকাল না।\nএটুকুই অনির্বাণের জন্য যথেষ্ট।\n“দাদু,” সে ফিসফিস করে বলল, “তুমি মরে গিয়েছিলে তিনটে দশে... ইচ্ছে করে?”\nবৃদ্ধ ম্লান হাসলেন। “আর কোনো উপায় ছিল না, ভাই। নবীন ঘড়ির ভেতরে বাঁধা ছিল, কিন্তু ঘড়ির কাঁটা যত দিন বাঁচত, ততদিন ও দুর্বল থাকত। আমি জানতাম, আমি চলে গেলে কাঁটা কেউ আটকে রাখতে পারবে না। তাই নিজেকে ওর সঙ্গে বেঁধে দিলাম। ঠিক ওই মুহূর্তে মরলাম, যাতে আমার আত্মাও ওই তিনটে দশেই আটকে থাকে। আমি ছিলাম ওর তালা।”\n“আর ডাক?” অনির্বাণের গলা ধরে এল। “ওই ডাক? ওই গলা?”\n“সবই ও। ও আমার গলা চুরি করেছিল, কারণ ও জানত, তুই আমার ডাকে সাড়া দিবি। খাতার শেষ লাইনটাও ওর হাতের লেখা। আমার হাতে আর কলম ধরার জোর ছিল না, অনি।”\nনবীনের কালো ছায়া এবার ঘরের দেয়াল বেয়ে ছড়িয়ে পড়ছে, ছাদে, জানালায়, মেঝের ফাটলে। নিতাই আর মৌলবি পিছিয়ে এসে দরজার চৌকাঠে সেঁটে গেলেন। মৌলবি সাহেবের ঠোঁট নড়ছে, দোয়া থামাচ্ছেন না।\n“তোরা সবাই মিলে এসেছিস আমাকে শেষ করতে?” ছায়াটা চিৎকার করল। “আমার বংশ! আমার রক্ত! তোরা আমাকে এভাবে...”\n“আপনার রক্ত বলেই আজ আপনার বিচার হচ্ছে,” অনির্বাণ বলল। তার নিজের গলার জোরে সে নিজেই অবাক হলো। “আপনি যা করেছেন, সেটা আমার বংশের অপরাধ। আর সেই অপরাধ আমরা স্বীকার করছি। দাদু করে গেছেন। আমি করছি।”\nসে সাদেকের দিকে ফিরে দাঁড়াল, দুই হাত জোড় করে।\n“আমাদের পূর্বপুরুষ তোমার ওপর যে অন্যায় করেছেন, তার জন্য আমি ক্ষমা চাইছি। তুমি মাফ না করলেও আমার কিছু বলার নেই। কিন্তু আজ যদি তুমি এখানে এসে থাকো, তাহলে আমি জানি, তুমি অন্তত শেষ কথাটা বলতে এসেছ।”\nসাদেক নীরবে এগিয়ে এল। ঘরের ঠান্ডা বাতাস যেন তার পায়ের নিচে কুঁকড়ে সরে যাচ্ছে। সে ঘড়ির সামনে দাঁড়াল। নবীনের কালো ছায়া তার চোখের দিকে তাকিয়ে কেঁপে উঠল, যেন এই প্রথম সে বুঝতে পারল, ভয় কাকে বলে।\nসাদেক তার ছোট পিতলের ঘড়িটা এগিয়ে ধরল, ঘড়ির কাচে। দুটো ঘড়ির টিকটিক এক হয়ে গেল।\nতারপর সে অনির্বাণের দিকে তাকিয়ে খুব ছোট্ট করে মাথা নাড়ল। অনুমতির মতো।\nঅনির্বাণ বুঝল। সে ধীর পায়ে ঘড়ির সামনে গিয়ে দাঁড়াল। তিনটে দশে আটকে থাকা মিনিটের কাঁটাটা সে আঙুল দিয়ে আলতো করে ছুঁয়ে একটা ঘর এগিয়ে দিল।\nতিনটে এগারো।\nনবীনের ছায়া আর্তনাদে ফেটে পড়ল। ঘরের সব জানালার কাচ ঝনঝন করে ভেঙে গেল। ঘড়ির খোলে ফাটল ধরে একটা আলো বেরিয়ে এল, ঠান্ডা, সাদা, তীব্র। সেই আলোয় নবীনের কালো আকার গলে গলে মেঝেতে ছড়িয়ে পড়ল, তারপর বাতাসে মিলিয়ে গেল, যেন কোনোদিন ছিলই না।\nআর তারপর, চুপচাপ।\nঅনির্বাণ যখন চোখ খুলল, ঘরে তিনজন মানুষ দাঁড়িয়ে। নিতাই, মৌলবি, আর সে নিজে। কোণে কেউ নেই, দরজায় কেউ নেই।\nঘড়ির কাঁটা টিক টিক করে ঘুরে চলেছে, স্বাভাবিক, শান্ত। পুব আকাশে তখন ভোরের প্রথম ফ্যাকাশে আলো।\n* * *\nতিন দিন পর, কালিদহ হল্ট স্টেশনে, অনির্বাণ সকালের প্রথম ট্রেনের জন্য দাঁড়িয়ে ছিল।\nঘোষাল বাড়ি সে বিক্রি করেনি। নিতাইয়ের হাতে চাবি দিয়েছে। পদ্মদিদি সেই ভোরেই, নিজের কুঁড়েঘরে, হাসিমুখে শেষ নিশ্বাস ফেলেছিলেন। গ্রামের লোক বলে, পুরো একটা জীবন যে কথা বুকে চেপে ছিলেন, সেটা বলে ফেলেই তিনি মুক্তি পেয়েছেন। ঘড়িটা এখন বৈঠকখানায় ঠিকঠাক চলে, কেউ সময় মেলাতে গেলে এখনও ঠিক মেলে।\nট্রেন আসতে তখনও দেরি। প্ল্যাটফর্মে একটাই টিমটিমে বাতি, আর বাতাসে ভেজা মাটির গন্ধ।\nঠিক তখন, পেছন থেকে, বহুদূর থেকে, ভেসে এল একটা চেনা, নরম, স্নেহময় ডাক:\n“অনি...”\nঅনির্বাণ থমকে দাঁড়াল। শিরদাঁড়া বেয়ে একটা শিরশিরে স্রোত নামল। এ কি আবার সেই?\nকিন্তু গলাটা এবার অন্যরকম। কোনো হাসি নেই, কোনো লোভ নেই। শুধু একটা বিদায়ের ভার।\nসে বাতাসের দিকে তাকিয়ে, খুব আস্তে, মাথা নিচু করে হাসল। উত্তর দিল না।\nট্রেনের হুইসেল শোনা গেল।\n<strong>সমাপ্ত</strong>"]]}
];
const tabs=document.getElementById("tabs"),box=document.getElementById("books");
B.forEach((b,i)=>{
 tabs.insertAdjacentHTML("beforeend",`<button class="tab t${i}" role="tab" aria-selected="${i==0}" onclick="show(${i})">${b.n}</button>`);
 const toc=b.ch.map((c,j)=>`<a href="#c${i}-${j}">${c[0]}</a>`).join("");
 const chs=b.ch.map((c,j)=>`<section class="ch" id="c${i}-${j}"><h2>${c[0]}</h2><div class="bar"></div>${c[1]?c[1].split("\n").map(p=>`<p>${p}</p>`).join(""):`<p class="pend">এই অধ্যায়ের লেখা শিগগিরই বসানো হবে।</p>`}<div class="act"><button class="cp" ${c[1]?"":"disabled"} onclick="cp(${i},${j},this)">কপি করুন</button><a href="#toc${i}">সূচীতে ফিরুন</a></div></section>`).join("");
 box.insertAdjacentHTML("beforeend",`<div class="book t0" id="b${i}" ${i?"hidden":""}><header class="cover"><h1>${b.n}</h1><p class="sub">${b.s}</p><p class="by">লেখক</p><p class="au">নুরজাহান আঁখি</p></header><nav class="toc" id="toc${i}"><h2>সূচী</h2>${toc}</nav>${chs}</div>`);
});
function show(i){B.forEach((_,k)=>{document.getElementById("b"+k).hidden=k!=i;tabs.children[k].setAttribute("aria-selected",k==i)});scrollTo(0,0)}
function cp(i,j,b){const t=B[i].ch[j][0]+"\n\n"+B[i].ch[j][1];const ok=()=>{b.textContent="কপি হয়েছে ✓";setTimeout(()=>b.textContent="কপি করুন",1600)};
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(ok,()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()})}
</script>
